<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#F6E8DF" />
  
  <!-- Subtle tactile dot grid -->
  <pattern id="dot-grid" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#211F25" fill-opacity="0.08" />
  </pattern>
  <rect width="1200" height="630" fill="url(#dot-grid)" />

  <!-- Outer Editorial Frame -->
  <rect x="32" y="32" width="1136" height="566" rx="28" fill="none" stroke="#211F25" stroke-width="2" stroke-opacity="0.15" />
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="#FFFAF6" stroke="#211F25" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Availability Pill -->
  <g transform="translate(80, 88)">
    <rect width="420" height="36" rx="18" fill="#F6E8DF" stroke="#211F25" stroke-width="1" stroke-opacity="0.2" />
    <circle cx="20" cy="18" r="5" fill="#A84F32" />
    <text x="36" y="23" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#211F25" letter-spacing="1.5">OPEN TO AI &amp; SOFTWARE ENGINEERING</text>
  </g>

  <!-- Central Editorial Headline -->
  <g transform="translate(80, 200)">
    <text x="0" y="0" font-family="'Space Grotesk', system-ui, sans-serif" font-size="64" font-weight="900" fill="#211F25" letter-spacing="-2">ATHARVA KALE</text>
    <text x="0" y="70" font-family="'Space Grotesk', system-ui, sans-serif" font-size="44" font-weight="800" fill="#A84F32" letter-spacing="-1">AI Systems &amp; Software Engineering</text>
    <text x="0" y="130" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="400" fill="#211F25" fill-opacity="0.75">
      Building autonomous AI pipelines, resilient full-stack applications &amp; digital products.
    </text>
  </g>

  <!-- Tag Matrix Strip -->
  <g transform="translate(80, 420)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="42" rx="21" fill="#E8E2FC" stroke="#211F25" stroke-width="1" stroke-opacity="0.15" />
    <text x="90" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#211F25">Agentic AI &amp; LLMs</text>
    
    <!-- Pill 2 -->
    <rect x="195" y="0" width="165" height="42" rx="21" fill="#E2F0E6" stroke="#211F25" stroke-width="1" stroke-opacity="0.15" />
    <text x="277" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#211F25">Full-Stack TS</text>
    
    <!-- Pill 3 -->
    <rect x="375" y="0" width="195" height="42" rx="21" fill="#F3DCD0" stroke="#211F25" stroke-width="1" stroke-opacity="0.15" />
    <text x="472" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#211F25">FastAPI &amp; pgvector</text>
  </g>

  <!-- Footer Metadata -->
  <g transform="translate(80, 520)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#211F25" fill-opacity="0.6" letter-spacing="1">
      COMPUTER SCIENCE ENGINEERING • CLASS OF 2027 • GITHUB: @Atharva0393
    </text>
  </g>

  <!-- Terracotta Stamp in Top Right -->
  <g transform="translate(1040, 140)">
    <circle cx="0" cy="0" r="48" fill="#A84F32" />
    <path d="M0 -22V22M-22 0H22M-15 -15L15 15M-15 15L15 -15" stroke="#FFFAF6" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
